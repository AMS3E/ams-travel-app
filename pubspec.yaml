name: ams_travel
description: "AMS Travel — discover Cambodia's hidden gems. Mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.2.0           # widgets and theming
  go_router: ^18.0.1            # routing
  provider: ^6.1.5+1            # state

  dio: ^5.11.1                  # HTTP, for the API
  shared_preferences: ^2.5.5    # session, saves, preferences on the device

  flutter_map: ^8.3.2           # maps
  latlong2: ^0.10.1

  cached_network_image: ^4.0.0  # place photos
  google_fonts: ^8.2.1          # Geist, bundled in assets/google_fonts
  font_awesome_flutter: ^11.0.0 # social brand icons

  url_launcher: ^6.3.2          # call, mail, open a website
  share_plus: ^13.3.0           # share a place

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/mock/
    - assets/google_fonts/

# App icon generated from the AMS Travel logo: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
